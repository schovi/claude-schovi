<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>workflow board</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--col:#ebecf0;--card:#fff;--line:#dfe1e6;--muted:#6b778c;--accent:#0052cc;--warn:#bf2600}
@media(prefers-color-scheme:dark){:root{--bg:#1d2125;--col:#22272b;--card:#2c333a;--line:#3d4750;--muted:#9fadbc;--accent:#579dff;--warn:#ff6b5b}}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:inherit}
header{padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;font-weight:600}
#filters,#tagfilters{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
#filters button,#tagfilters button{background:var(--col);border:1px solid var(--line);padding:2px 10px;border-radius:12px;cursor:pointer;font-size:12px}
#filters button.active,#tagfilters button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#tagfilters button{border-style:dashed}
input[type=text]{padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:inherit}
button{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:inherit;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#board{display:flex;gap:12px;padding:16px;overflow-x:auto;align-items:flex-start}
.column{background:var(--col);border-radius:8px;padding:8px;min-width:260px;width:260px;flex:0 0 auto}
.column h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .repo{font-size:11px;color:var(--muted)}
.card .title{font-weight:500;margin:2px 0}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--col)}
.badge.prio{background:var(--accent);color:#fff}
.badge.waits{background:var(--warn);color:#fff}
.badge.wt{background:#8777d9;color:#fff}
.badge.gate{background:#ffab00;color:#000}
.badge.tag{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.done{color:var(--muted);font-size:12px;padding:4px 6px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}
#modal{background:var(--card);border-radius:8px;padding:20px 24px;width:min(1040px,95vw);max-height:92vh;overflow:auto}
#modal h3{margin:0 0 12px;font-size:14px}
#modal textarea{width:100%;height:min(64vh,720px);font:13px/1.5 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:inherit}
#modal .row{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.md{font-size:15px;line-height:1.55;max-height:74vh;overflow:auto}
.md h1{font-size:19px;margin:0 0 12px}
.md h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 0 6px}
.md h3,.md h4{font-size:14px;margin:14px 0 4px}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0;padding-left:24px}
.md li{margin:3px 0}
.md a{color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.md code{background:var(--col);padding:1px 5px;border-radius:3px;font:13px/1.4 ui-monospace,Menlo,monospace}
.md pre{background:var(--col);padding:10px 12px;border-radius:4px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,monospace}
.md blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.md input[type=checkbox]{margin-right:6px}
select{padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:inherit}
.err{color:var(--warn);font-size:12px}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:10}
.toast{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:340px}
</style></head><body>
<header>
  <h1>workflow board</h1>
  <div id="filters"></div>
  <div id="tagfilters"></div>
  <input type="text" id="q" placeholder="filter text…">
  <button id="add">+ Draft</button>
  <button id="refresh">↻</button>
  <button id="bell" title="Enable desktop notifications">🔔</button>
  <span id="status" style="color:var(--muted);font-size:12px"></span>
</header>
<div id="board"></div>
<div id="overlay"><div id="modal"></div></div>
<div id="toasts"></div>
<script id="md">
// Minimal markdown for task bodies: headings, bullet/numbered lists, checkboxes,
// fenced + inline code, links, bold, quotes, rules. Escapes first, so task text can
// never inject HTML. Flat by design — task files don't nest lists. DOM-free so
// `board.ts --selftest` can eval this block; keep it that way.
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function inlineMd(s){
  return s.replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
}

function md(src){
  const out=[];let list=null,code=false,para=[];
  // <br> not " ": task bodies are line-oriented notes (meta lines, one-per-line
  // criteria), so collapsing their newlines the way markdown would reads worse.
  const flush=()=>{if(para.length){out.push("<p>"+inlineMd(para.join("<br>"))+"</p>");para=[]}};
  const endList=()=>{if(list){out.push("</"+list+">");list=null}};
  for(const line of esc(src).split("\n")){
    if(/^\s*```/.test(line)){flush();endList();code=!code;out.push(code?"<pre>":"</pre>");continue}
    if(code){out.push(line);continue}
    let m;
    if(m=/^(#{1,6})\s+(.*)$/.exec(line)){flush();endList();const n=m[1].length;out.push(`<h${n}>${inlineMd(m[2])}</h${n}>`);continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){flush();endList();out.push("<hr>");continue}
    if(m=/^\s*(?:[-*+]|\d+\.)\s+(.*)$/.exec(line)){
      flush();
      const kind=/^\s*\d/.test(line)?"ol":"ul";
      if(list!==kind){endList();out.push("<"+kind+">");list=kind}
      out.push("<li>"+inlineMd(m[1]).replace(/^\[([ xX])\]\s*/,(_,c)=>`<input type="checkbox" disabled${c===" "?"":" checked"}> `)+"</li>");
      continue;
    }
    if(m=/^\s*&gt;\s?(.*)$/.exec(line)){flush();endList();out.push("<blockquote>"+inlineMd(m[1])+"</blockquote>");continue}
    if(!line.trim()){flush();endList();continue}
    para.push(line.trim());
  }
  flush();endList();if(code)out.push("</pre>");
  return out.join("\n");
}
</script>
<script>
const COLS=["draft","ready","in-progress","blocked","done"];
const EDITABLE=["draft","ready"];
let DATA=[], prev=null;  // prev: last snapshot for change diff
let selected=null;       // null = show all repos
let showDone=false;      // done column collapsed by default
let activeTags=new Set();// AND across selected tags, same as `./workflow/status --tag`
let openTask=null;       // "repo/id" of the card in the modal
let modalKey=null;       // which card the modal actually shows, so a refresh can't clobber an edit

// The URL is the only place view state lives: ?repo=&tags=&q=&done=1&task=repo/41.
// Query, not hash — the server routes on pathname alone, so a shared link works as is,
// and pushState on open means Back closes the card.
function readURL(){
  const p=new URLSearchParams(location.search);
  selected=p.get("repo")||null;
  activeTags=new Set((p.get("tags")||"").split(",").filter(Boolean));
  showDone=p.get("done")==="1";
  openTask=p.get("task")||null;
  document.getElementById("q").value=p.get("q")||"";
}
function writeURL(push){
  const p=new URLSearchParams();
  if(selected)p.set("repo",selected);
  if(activeTags.size)p.set("tags",[...activeTags].join(","));
  const q=document.getElementById("q").value.trim(); if(q)p.set("q",q);
  if(showDone)p.set("done","1");
  if(openTask)p.set("task",openTask);
  const s=p.toString(), url=location.pathname+(s?"?"+s:"");
  push?history.pushState(null,"",url):history.replaceState(null,"",url);
}

function toggleTag(tag){
  activeTags.has(tag)?activeTags.delete(tag):activeTags.add(tag);
  writeURL();
  render();
}

function snapshot(){
  const m=new Map();
  for(const r of DATA)for(const t of r.tasks)m.set(r.repo+"/"+t.id,{repo:r.repo,title:t.title,section:t.section,body:t.body});
  return m;
}
function announce(prev,cur){
  const msgs=[];
  for(const [k,v] of cur){
    const p=prev.get(k);
    if(!p)msgs.push(["🆕 new",v]);
    else if(p.section!==v.section)msgs.push([v.section==="done"?"✅ done":`➡️ ${p.section}→${v.section}`,v]);
    else if(p.body!==v.body)msgs.push(["✏️ changed",v]);
  }
  for(const [k,p] of prev)if(!cur.has(k))msgs.push(["🗑 removed",p]);  // gone from every folder = deleted
  if(!msgs.length)return;
  if(msgs.length>5){emit(`${msgs.length} task changes`,"");return}  // avoid a flood after being away
  for(const [tag,v] of msgs)emit(tag,`${v.repo} · ${v.title}`);
}
function emit(title,body){
  const text=title+(body?": "+body:"");
  toast(text);
  if(window.Notification&&Notification.permission==="granted")new Notification("workflow board",{body:text});
}
function toast(text){
  const el=document.createElement("div");el.className="toast";el.textContent=text;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>el.remove(),6000);
}

async function load(){
  DATA=await (await fetch("/api/board")).json();
  const cur=snapshot(); if(prev)announce(prev,cur); prev=cur;  // notify deltas (skip first load — no baseline)
  const f=document.getElementById("filters"); f.innerHTML="";
  for(const r of DATA){
    const b=document.createElement("button");
    b.textContent=r.repo;
    b.onclick=()=>{selected=selected===r.repo?null:r.repo;writeURL();render()};  // click to isolate, click again to clear
    f.appendChild(b);
  }
  render();
  syncModal();
}

function matches(t,q){return (t.title+" "+t.repo+" "+t.id+" "+(t.tags||[]).join(" ")).toLowerCase().includes(q)}

function hasTags(t){for(const tag of activeTags)if(!(t.tags||[]).includes(tag))return false;return true}

function renderTagChips(visible){
  const box=document.getElementById("tagfilters"); box.innerHTML="";
  const all=new Set(visible.flatMap(t=>t.tags||[]));
  for(const tag of activeTags)all.add(tag);  // keep a selected tag clickable even when it filters everything out
  for(const tag of [...all].sort()){
    const b=document.createElement("button");
    b.textContent="#"+tag;
    b.classList.toggle("active",activeTags.has(tag));
    b.onclick=()=>toggleTag(tag);
    box.appendChild(b);
  }
}

function render(){
  const q=document.getElementById("q").value.toLowerCase();
  document.querySelectorAll("#filters button").forEach(b=>b.classList.toggle("active",b.textContent===selected));
  const cards={}; COLS.forEach(c=>cards[c]=[]);
  const inRepo=[];
  let doneTotal=0;
  for(const r of DATA){
    if(selected && r.repo!==selected)continue;
    for(const t of r.tasks){
      inRepo.push(t);
      if(!hasTags(t))continue;
      if(t.section==="done")doneTotal++;
      if(q && !matches(t,q))continue;
      cards[t.section].push(t);
    }
  }
  renderTagChips(inRepo);
  const board=document.getElementById("board"); board.innerHTML="";
  for(const c of COLS){
    const col=document.createElement("div"); col.className="column";
    if(c==="done"){
      const reveal=showDone||!!q;  // a text query always surfaces matching done tasks
      const h=document.createElement("h2");
      h.textContent=`done (${q?cards.done.length+" matched":doneTotal})`;
      const btn=document.createElement("button");
      btn.textContent=reveal?"hide":"show all"; btn.style.cssText="float:right;font-size:11px;padding:0 6px";
      btn.onclick=()=>{showDone=!showDone;writeURL();render()};
      h.appendChild(btn); col.appendChild(h);
      if(reveal)for(const t of cards.done)col.appendChild(cardEl(t));
      else{const d=document.createElement("div");d.className="done";d.textContent=`${doneTotal} completed — history, see git`;col.appendChild(d)}
    }else{
      col.innerHTML=`<h2>${c} (${cards[c].length})</h2>`;
      for(const t of cards[c])col.appendChild(cardEl(t));
    }
    board.appendChild(col);
  }
  document.getElementById("status").textContent=`${DATA.length} repos · ${doneTotal} done`;
}

function cardEl(t){
  const el=document.createElement("div"); el.className="card";
  let b="";
  if(t.meta.priority)b+=`<span class="badge prio">P${t.meta.priority}</span>`;
  if(t.waits.length)b+=`<span class="badge waits">waits: ${t.waits.join(", ")}</span>`;
  if(t.meta.gate)b+=`<span class="badge gate">gate</span>`;
  if(t.meta.done)b+=`<span class="badge">✓ ${t.meta.done}</span>`;
  for(const w of t.worktree)b+=`<span class="badge wt">${esc(w)}</span>`;
  for(const tag of t.tags||[])b+=`<span class="badge tag" data-tag="${esc(tag)}">#${esc(tag)}</span>`;
  el.innerHTML=`<div class="repo">${t.repo}</div><div class="title">${esc(t.title)}</div><div class="badges">${b}</div>`;
  el.onclick=e=>{
    const tag=e.target.dataset&&e.target.dataset.tag;
    tag?toggleTag(tag):openCard(t);  // tag badge filters; anywhere else opens the detail
  };
  return el;
}

function openModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("overlay").style.display="flex"}
function hideModal(){modalKey=null;document.getElementById("overlay").style.display="none"}
function close(){openTask=null;writeURL();hideModal()}

function findTask(key){
  const i=key.indexOf("/"), repo=key.slice(0,i), id=key.slice(i+1);
  for(const r of DATA)if(r.repo===repo)for(const t of r.tasks)if(String(t.id)===id)return t;
  return null;
}

// Reconcile the modal with ?task= after a load or a Back/Forward. Equal keys mean
// nothing to do, which also leaves the New-draft dialog (both null) alone.
function syncModal(){
  if(openTask===modalKey)return;
  const t=openTask&&findTask(openTask);
  if(t)view(t); else {openTask=null;writeURL();hideModal()}
}

function openCard(t){openTask=t.repo+"/"+t.id;writeURL(true);view(t)}

function view(t){
  modalKey=openTask;
  const editable=EDITABLE.includes(t.section);
  openModal(`<h3>${esc(t.repo)} · ${esc(t.file)} <span style="color:var(--muted);font-weight:400">— ${esc(t.section)}</span></h3>
    <div class="md">${md(t.body)}</div>
    <div class="row">${editable?`<button class="primary" id="editbtn">Edit</button>`
      :`<span style="color:var(--muted);font-size:12px">read-only — /work and the acceptance gate own ${esc(t.section)}</span>`}
    <button id="cancel">Close</button></div>`);
  document.getElementById("cancel").onclick=close;
  if(editable)document.getElementById("editbtn").onclick=()=>edit(t);
}

function edit(t){
  openModal(`<h3>${esc(t.repo)} · ${esc(t.file)} <span style="color:var(--muted);font-weight:400">— raw markdown</span></h3>
    <textarea id="body">${esc(t.body)}</textarea>
    <div class="row">status: <select id="to">${EDITABLE.map(s=>`<option ${s===t.section?"selected":""}>${s}</option>`).join("")}</select>
    <button class="primary" id="save">Save & commit</button><button id="cancel">Cancel</button>
    <span class="err" id="err"></span></div>`);
  document.getElementById("cancel").onclick=()=>view(t);
  document.getElementById("save").onclick=async()=>{
    const r=await post("/api/save",{repo:t.repo,section:t.section,file:t.file,to:document.getElementById("to").value,body:document.getElementById("body").value});
    if(r.ok){close();load()}else document.getElementById("err").textContent=r.error;
  };
}

function addDraft(){
  const repos=DATA.map(r=>r.repo);
  openModal(`<h3>New draft</h3>
    <div class="row">repo: <select id="repo">${repos.map(r=>`<option>${r}</option>`).join("")}</select></div>
    <div class="row"><input type="text" id="title" placeholder="title" style="flex:1"></div>
    <textarea id="what" placeholder="what & why…"></textarea>
    <div class="row"><button class="primary" id="create">Create & commit</button><button id="cancel">Cancel</button>
    <span class="err" id="err"></span></div>`);
  document.getElementById("cancel").onclick=close;
  document.getElementById("create").onclick=async()=>{
    const title=document.getElementById("title").value.trim();
    if(!title){document.getElementById("err").textContent="title required";return}
    const r=await post("/api/draft",{repo:document.getElementById("repo").value,title,what:document.getElementById("what").value});
    if(r.ok){close();load()}else document.getElementById("err").textContent=r.error;
  };
}

async function post(url,body){return (await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json()}

document.getElementById("q").oninput=()=>{writeURL();render()};
document.getElementById("add").onclick=addDraft;
document.getElementById("refresh").onclick=load;
document.getElementById("bell").onclick=()=>window.Notification&&Notification.requestPermission();
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")close()};
window.onpopstate=()=>{readURL();render();syncModal()};
readURL();
load();
// Live updates: server pushes on any workflow/ file change. Safety poll covers
// the rare case a filesystem watch event is dropped.
new EventSource("/api/events").onmessage=load;
setInterval(load,30000);
</script></body></html>
